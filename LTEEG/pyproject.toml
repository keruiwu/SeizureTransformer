[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lteeg"
version = "0.1.0"
description = "Point-level (per-sample) seizure detection framework for long-term EEG"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "h5py>=3.6",
    "pyyaml>=6.0",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "timescoring>=0.0.6", "scikit-learn>=1.0"]

[project.scripts]
lteeg = "lteeg.cli:main"

[tool.setuptools.packages.find]
include = ["lteeg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
